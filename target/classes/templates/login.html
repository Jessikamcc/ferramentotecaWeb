<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramentoteca - Login</title>

    <link rel="stylesheet" href="/css/login.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <main class="login-page">

        <!-- Logo -->
        <header class="logo-area">

            <div class="logo">

                <img src="/img/gear.svg" alt="Engrenagem" class="gear">

                <img src="/img/wrench.svg" alt="Chave" class="wrench">

            </div>

            <h1>FERRAMENTOTECA</h1>

            <p>Sistema de Gerenciamento de Ferramentas</p>

        </header>

        <!-- Card Login -->
        <section class="login-card">

            <h2>Faça login para continuar</h2>

            <div class="line"></div>

            <form id="loginForm" novalidate> 

                <!-- Usuário -->
                <div class="input-group">

                    <label for="usuario">
                        Usuário
                    </label>

                    <div class="input-field">

                        <i class="bi bi-person"></i>

                        <input type="text" id="usuario" placeholder="Digite seu usuário">

                    </div>

                </div>

                <!-- Senha -->
                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="input-field">

                        <i class="bi bi-lock"></i>

                        <input type="password" id="senha" placeholder="Digite sua senha">

                        <button type="button" class="show-password" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>

                <!-- Botão -->

                <button class="btn-login" id="btnEntrar" type="submit">

                    <i class="bi bi-lock-fill"></i>

                    Entrar

                </button>

            </form>

        </section>

        <!-- Rodapé -->

        <footer>

            <p>© 2025 Ferramentoteca</p>

            <p>Todos os direitos reservados.</p>

        </footer>

    </main>

    <script src="/js/login.js" defer></script>

</body>

</html>
