<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimo | Ferramentoteca</title>

    <!-- Ícones do Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS da página -->
    <link rel="stylesheet" href="/css/emprestimos.css">
</head>

<body>
    <header class="cabecalho-emprestimo">
        <h1>EMPRÉSTIMO</h1>
    </header>

    <main class="pagina-emprestimo">
        <div class="conteudo-emprestimo">

            <!-- Pesquisa da ferramenta -->
            <section class="secao-pesquisa" aria-labelledby="titulo-pesquisa">
                <h2 id="titulo-pesquisa" class="titulo-campo">
                    ID ou Nome da Ferramenta:
                </h2>

                <form id="formPesquisa" class="form-pesquisa">
                    <div class="linha-pesquisa">
                        <label for="ferramenta" class="sr-only">
                            ID ou nome da ferramenta
                        </label>

                        <input
                            type="search"
                            id="ferramenta"
                            name="ferramenta"
                            placeholder="Digite o nome da ferramenta"
                            autocomplete="off"
                        >

                        <button type="submit" class="btn-buscar">
                            <i class="bi bi-search" aria-hidden="true"></i>
                            <span>Buscar</span>
                        </button>
                    </div>
                </form>

                <p class="aviso-disponibilidade">
                    <i class="bi bi-info-circle" aria-hidden="true"></i>
                    Mostra-se apenas se a ferramenta estiver disponível.
                </p>

                <!-- Resultado da pesquisa -->
                <article class="card-ferramenta" id="resultadoFerramenta">
                    <p><strong>Nome:</strong> Furadeira</p>
                    <p><strong>Descrição:</strong> Furadeira de impacto 16mm - 110V</p>
                    <p><strong>Localização:</strong> Almoxarifado</p>
                </article>
            </section>

            <!-- Dados do empréstimo -->
            <section class="secao-dados" aria-labelledby="titulo-dados">
                <h2 id="titulo-dados">Dados para cadastrar empréstimo:</h2>

                <form id="formEmprestimo" class="form-emprestimo">
                    <div class="grupo-campos">
                        <div class="linha-campo">
                            <label for="professor">
                                Professor:<span class="obrigatorio">*</span>
                            </label>

                            <input
                                type="text"
                                id="professor"
                                name="professor"
                                placeholder="Digite o nome do professor"
                                autocomplete="name"
                                required
                            >
                        </div>

                        <div class="linha-campo">
                            <label for="dataEmprestimo">
                                Data do empréstimo:<span class="obrigatorio">*</span>
                            </label>

                            <input
                                type="date"
                                id="dataEmprestimo"
                                name="dataEmprestimo"
                                required
                            >
                        </div>

                        <div class="linha-campo">
                            <label for="dataDevolucao">
                                Data de devolução:<span class="obrigatorio">*</span>
                            </label>

                            <input
                                type="date"
                                id="dataDevolucao"
                                name="dataDevolucao"
                                required
                            >
                        </div>
                    </div>

                    <div class="area-confirmacao">
                        <button type="submit" class="btn-confirmar">
                            <i class="bi bi-check-circle" aria-hidden="true"></i>
                            <span>Confirmar Empréstimo</span>
                        </button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    
    <script src="/js/emprestimos.js" defer></script>
</body>
</html>
