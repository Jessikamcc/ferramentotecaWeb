<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inventário | Ferramentoteca</title>

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS da tela -->
    <link rel="stylesheet" href="/css/inventario.css">
</head>

<body>

    <main class="pagina-inventario">

        <!-- Cabeçalho -->
        <header class="cabecalho-inventario">
            <h1>INVENTÁRIO</h1>
        </header>

        <section class="conteudo-inventario">

            <!-- Filtros -->
            <form class="area-filtros" id="formFiltros">

                <!-- Nome -->
                <div class="grupo-filtro filtro-nome">
                    <label for="nome">Nome</label>

                    <div class="campo-com-icone">
                        <input
                            type="search"
                            id="nome"
                            name="nome"
                            placeholder="Buscar por nome"
                            autocomplete="off"
                        >

                        <i class="bi bi-search" aria-hidden="true"></i>
                    </div>
                </div>

                <!-- Status -->
                <div class="grupo-filtro">
                    <label for="status">Status</label>

                    <select id="status" name="status">
                        <option value="">Todos</option>
                        <option value="disponivel">Disponível</option>
                        <option value="emprestada">Emprestada</option>
                        <option value="desativada">Desativada</option>
                    </select>
                </div>

                <!-- Localização -->
                <div class="grupo-filtro">
                    <label for="localizacao">Localização</label>

                    <select id="localizacao" name="localizacao">
                        <option value="">Todas</option>
                        <option value="almoxarifado">Almoxarifado</option>
                        <option value="oficina">Oficina</option>
                        <option value="deposito">Depósito</option>
                    </select>
                </div>

                <!-- Botão Buscar -->
                <button class="botao-buscar" type="submit">
                    <i class="bi bi-search" aria-hidden="true"></i>
                    <span>Buscar</span>
                </button>

            </form>

            <!-- Texto de orientação -->
            <p class="texto-orientacao" id="ajudaFiltros">
                Preencha um ou mais filtros para buscar.
                Todos os filtros são opcionais.
            </p>

            <!-- Tabela -->
            <div class="area-tabela">

                <table class="tabela-inventario">

                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nome</th>
                            <th scope="col">Status</th>
                            <th scope="col">Localização</th>
                            <th scope="col">Data de Devolução</th>
                            <th scope="col">Responsável</th>
                            <th scope="col">Motivo da Desativação</th>
                        </tr>
                    </thead>

                    <tbody id="corpoTabela">
                        <!-- Conteúdo carregado pelo inventario.js -->
                    </tbody>

                </table>

            </div>

            <!-- Limpar filtros -->
            <button
                class="botao-limpar"
                id="botaoLimpar"
                type="button"
            >
                <i class="bi bi-funnel-fill" aria-hidden="true"></i>
                <span>Limpar filtros</span>
            </button>

        </section>

    </main>

    <!-- JavaScript da tela -->
    <script src="/js/inventario.js"></script>

</body>

</html>
